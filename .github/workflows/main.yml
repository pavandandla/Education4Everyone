name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install AWS CDK
        run: |
          npm install -g aws-cdk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS Authentication
        run: |
          aws sts get-caller-identity

      - name: Bootstrap AWS CDK
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          cdk bootstrap aws://$ACCOUNT_ID/us-east-1


      - name: Deploy Infrastructure with CDK
        run: |
          cd cdk
          cdk deploy --app "python app.py" --require-approval never

      - name: Retrieve EC2 Public IP
        run: |
          EC2_PUBLIC_IP=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=edu-learn" \
          --query "Reservations[*].Instances[*].PublicIpAddress" --output text)
          echo "EC2 Public IP: $EC2_PUBLIC_IP"
          echo "EC2_PUBLIC_IP=$EC2_PUBLIC_IP" >> $GITHUB_ENV

      - name: Deploy Kubernetes Application on EC2
        env:
          EC2_USER: "ubuntu"  # Change to "ec2-user" if using Amazon Linux
          SSH_KEY: ${{ vars.EC2_SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh -o StrictHostKeyChecking=no -i private_key.pem $EC2_USER@$EC2_PUBLIC_IP << 'EOF'
            sudo apt update && sudo apt install -y curl snapd
            
            # Install kubectl
            sudo snap install kubectl --classic
            kubectl version --client

            # Install Minikube
            curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
            chmod +x minikube-linux-amd64
            sudo mv minikube-linux-amd64 /usr/local/bin/minikube
            minikube version

            # Install Docker
            sudo apt install -y docker.io
            sudo systemctl enable --now docker
            sudo usermod -aG docker $USER

            # Start Minikube
            sudo minikube start --driver=docker

            # Deploy application to Minikube
            kubectl apply -f /home/ubuntu/k8s-manifests/deployment.yaml
            kubectl apply -f /home/ubuntu/k8s-manifests/service.yaml
            sleep 60  # Wait for services to stabilize

            kubectl get deployments
            kubectl get services
            kubectl get pods

            # Get the service NodePort
            NODE_PORT=$(kubectl get service flask-service -o=jsonpath='{.spec.ports[0].nodePort}')
            echo "NodePort: $NODE_PORT" >> /home/ubuntu/deployment.log

            # Forward service port to 80
            nohup kubectl port-forward --address 0.0.0.0 svc/flask-service 80:$NODE_PORT > /dev/null 2>&1 &
          EOF

      - name: Verify Deployment
        run: |
          curl -v http://$EC2_PUBLIC_IP
