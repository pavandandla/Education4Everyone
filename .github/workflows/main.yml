name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC authentication
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install AWS CDK
      run: |
        npm install -g aws-cdk
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Configure AWS credentials using IAM Role
      run: |
        export AWS_ROLE_ARN="arn:aws:iam::288761772602:instance-profile/pavan"
        export AWS_REGION="us-east-1"
        
        # Verify AWS authentication using the IAM role
        curl -X GET "http://169.254.169.254/latest/meta-data/iam/security-credentials/"
        aws sts get-caller-identity

    - name: Deploy with CDK
      run: |
        cdk deploy --require-approval never

    - name: Install Kubernetes & Minikube
      run: |
        sudo apt update && sudo apt install -y curl docker.io
        curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        sudo install minikube-linux-amd64 /usr/local/bin/minikube
        sudo snap install kubectl --classic
        sudo minikube start --driver=docker

    - name: Create deployment.yaml
      run: |
        cat <<EOF > deployment.yaml
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: flask-deployment
          labels:
            app: flask-app
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: flask-app
          template:
            metadata:
              labels:
                app: flask-app
            spec:
              containers:
              - name: flask-app
                image: public.ecr.aws/g2a4v8o8/edutech:latest
                ports:
                - containerPort: 5001
                env:
                - name: SQLALCHEMY_DATABASE_URI
                  value: "mysql://avnadmin:AVNS_-jsHTQVpt0c48J4oDF8@mysql-172f5ac6-dandlapavankumar-d7a9.f.aivencloud.com:26972/defaultdb"
        EOF

    - name: Create service.yaml
      run: |
        cat <<EOF > service.yaml
        apiVersion: v1
        kind: Service
        metadata:
          name: flask-service
        spec:
          type: LoadBalancer  
          selector:
            app: flask-app
          ports:
            - protocol: TCP
              port: 80
              targetPort: 5001
              nodePort: 30259  
        EOF

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f deployment.yaml
        kubectl apply -f service.yaml
        minikube service flask-service

    - name: Retrieve EC2 Public IP
      run: |
        INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
        PUBLIC_IP=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
        echo "EC2 Public IP: $PUBLIC_IP"

    - name: Port Forwarding for Service
      run: |
        nohup kubectl port-forward --address 0.0.0.0 svc/flask-service 30259:80 &
        echo "Port forwarding started. App should be accessible at http://$PUBLIC_IP:30259/"
