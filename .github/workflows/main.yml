name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install AWS CDK
        run: |
          npm install -g aws-cdk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Verify AWS Authentication
        run: |
          aws sts get-caller-identity

      - name: Login to EC2 via AWS Systems Manager (SSM)
        run: |
          EC2_INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=edu-learn" --query "Reservations[*].Instances[*].InstanceId" --output text)
          echo "EC2 Instance ID: $EC2_INSTANCE_ID"

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=$EC2_INSTANCE_ID" \
            --parameters 'commands=["echo Connected to EC2 via SSM", "whoami", "uname -a"]' \
            --region us-east-1

      #- name: Bootstrap CDK
        #run: |
          #cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/us-east-1

      #- name: Acknowledge CDK Notice
        #run: |
          #cdk acknowledge 32775

      #- name: Deploy with CDK
        #run: |
          #export PYTHONPATH="\${PYTHONPATH}:\${PWD}/cdk"
          #cd cdk
          #python app.py
          #cd ..
          #cdk deploy --require-approval never
          
      - name: Set up Kubernetes dependencies
        run: |
          # Update system packages
          sudo apt update && sudo apt install -y curl
          
          # Verify curl installation
          curl --version
          
          # Install kubectl via Snap
          sudo snap install kubectl --classic
          
          # Download Minikube binary
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          
          # Install Minikube
          chmod +x minikube-linux-amd64
          sudo mv minikube-linux-amd64 /usr/local/bin
          
          # Install Docker
          sudo apt install -y docker.io
          sudo systemctl enable --now docker
          sudo usermod -aG docker $USER
          newgrp docker
          
          # Start Minikube with Docker as the driver
          minikube start --driver=docker
          
          # Verify Minikube status
          minikube status

      - name: Create deployment.yaml
        run: |
          cat <<EOF > deployment.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: flask-deployment
            labels:
              app: flask-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: flask-app
            template:
              metadata:
                labels:
                  app: flask-app
              spec:
                containers:
                - name: flask-app
                  image: public.ecr.aws/g2a4v8o8/edutech:latest
                  ports:
                  - containerPort: 5001
                  env:
                  - name: SQLALCHEMY_DATABASE_URI
                    value: "mysql://avnadmin:AVNS_-jsHTQVpt0c48J4oDF8@mysql-172f5ac6-dandlapavankumar-d7a9.f.aivencloud.com:26972/defaultdb"
          EOF

      - name: Create service.yaml
        run: |
          cat <<EOF > service.yaml
          apiVersion: v1
          kind: Service
          metadata:
            name: flask-service
          spec:
            type: LoadBalancer  
            selector:
              app: flask-app
            ports:
              - protocol: TCP
                port: 80
                targetPort: 5001
                nodePort: 30259  
          EOF

      - name: Apply Kubernetes manifests
        run: |
          sudo kubectl apply -f deployment.yaml
          sudo kubectl apply -f service.yaml
          sudo minikube service flask-service
       
      - name: Update service.yaml with EC2 public IP
        run: |
          sudo kubectl port-forward --address 0.0.0.0 svc/flask-service 30259:80
