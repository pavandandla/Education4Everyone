name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install AWS CDK
        run: |
          npm install -g aws-cdk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Verify AWS Authentication
        run: |
          aws sts get-caller-identity

      - name: Login to EC2 via AWS Systems Manager (SSM)
        run: |
          EC2_INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=edu-learn" --query "Reservations[*].Instances[*].InstanceId" --output text)
          echo "EC2 Instance ID: $EC2_INSTANCE_ID"

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=$EC2_INSTANCE_ID" \
            --parameters 'commands=["echo Connected to EC2 via SSM", "whoami", "uname -a"]' \
            --region us-east-1

      #- name: Bootstrap CDK
        #run: |
          #cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/us-east-1

      #- name: Acknowledge CDK Notice
        #run: |
          #cdk acknowledge 32775

      #- name: Deploy with CDK
        #run: |
          #export PYTHONPATH="\${PYTHONPATH}:\${PWD}/cdk"
          #cd cdk
          #python app.py
          #cd ..
          #cdk deploy --require-approval never
          
      - name: Set up Kubernetes dependencies
        run: |
          # Update system packages
          sudo apt update && sudo apt install -y curl
          
          # Verify curl installation
          curl --version
          
          # Install kubectl via Snap
          sudo snap install kubectl --classic
          
          # Verify kubectl installation
          kubectl version --client
          
          # Download Minikube binary
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          
          # Install Minikube
          chmod +x minikube-linux-amd64
          sudo mv minikube-linux-amd64 /usr/local/bin/minikube
          
          # Verify Minikube installation
          minikube version
          
          # Install Docker
          sudo apt remove -y containerd.io runc
          sudo apt install -y docker.io
          sudo systemctl enable --now docker
          sudo usermod -aG docker $USER
          
          # Apply group changes
          newgrp docker
          
          # Verify Docker installation
          docker --version
          
          # Start Minikube with Docker as the driver
          minikube start --driver=docker

      - name: Apply Kubernetes manifests
        run: |
          minikube status
          kubectl apply -f k8s-manifests/deployment.yaml
          kubectl apply -f k8s-manifests/service.yaml
          echo "Waiting for 1 minute to let Kubernetes resources stabilize..."
          sleep 60
          kubectl get deployments
          kubectl get services
          kubectl get pods
          ssh -o StrictHostKeyChecking=no -L 30259:192.168.49.2:30259 ubuntu@172.31.40.36:30259
          curl http://172.31.40.36:30259
